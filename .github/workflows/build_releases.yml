name: Build Releases

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (Release, No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -a build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -y Runner.ipa Payload

      - name: Upload Runner.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Runner-ipa
          path: build/ios/ipa/Runner.ipa
          if-no-files-found: error

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Runner-ipa
          path: release-assets

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            APP_VER=$(grep -o 'v\.23\.[0-9]*\.[0-9]*' lib/main.dart | head -n 1 | sed 's/v\./v/')
            TAG="${APP_VER:-v23.19.1}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=Mi Nómina Pro $TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## Mi Nómina Pro (${{ steps.release_info.outputs.tag }})
            
            Compiled release binaries ready for installation:
            - 🤖 **Android**: `app-release.apk`
            - 🍏 **iOS (Unsigned)**: `Runner.ipa`
          files: |
            release-assets/app-release.apk
            release-assets/Runner.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
