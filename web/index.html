<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!-- For Android/Chrome -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=2"/>
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png?v=2"/>
   
  <!-- For Apple -->
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=2"/>
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png?v=2"/>
  
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Herramienta independiente creada con el objetivo de ayudar a los usuarios a estimar y visualizar de forma práctica su sueldo y horas extras">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mi Nómina Pro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Mi Nómina Pro</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
